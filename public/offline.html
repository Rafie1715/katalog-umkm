<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Koneksi Terputus - Sedang Offline</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #1b2420;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    .card {
      max-width: 440px;
      margin: 24px;
      padding: 32px;
      border: 1px solid #dde5e0;
      border-radius: 16px;
      background-color: #f1f5f2;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 12px 0;
      color: #1b2420;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #5b6a62;
      margin: 0 0 24px 0;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 8px;
      background-color: #1f6b4f;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #154d39;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Koneksi terputus</h1>
    <p>
      Katalog UMKM memerlukan koneksi internet untuk melihat produk terbaru dan memesan via WhatsApp. Silakan periksa jaringan internetmu lalu coba lagi.
    </p>
    <button onclick="window.location.reload()">Coba lagi</button>
  </div>
</body>
</html>
